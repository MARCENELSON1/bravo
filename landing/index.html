<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wellnod · El cerebro de tu local</title>
    <meta
      name="description"
      content="Wellnod es el sistema todo-en-uno para tu restaurante: comandas digitales, cobros y facturación ARCA, fichaje de empleados y un copiloto de IA en español."
    />
    <!-- Aplica el tema guardado antes de pintar, para evitar el flash de color -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("wellnod-landing:theme")
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
