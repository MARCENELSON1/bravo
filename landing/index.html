<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--SEO:start-->
    <title>Wellnod · El cerebro de tu local</title>
    <meta
      name="description"
      content="Wellnod es el sistema todo-en-uno para tu restaurante: comandas digitales, cobros y facturación ARCA, fichaje de empleados y un copiloto de IA en español."
    />
    <link rel="canonical" href="https://wellnod.com/" />

    <!-- Open Graph: lo que se ve al pegar el link en WhatsApp, LinkedIn o Slack -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wellnod" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://wellnod.com/" />
    <meta property="og:title" content="Wellnod · El cerebro de tu local" />
    <meta
      property="og:description"
      content="Comandas digitales, cobros y facturación ARCA, fichaje y un copiloto de IA en español. Todo tu restaurante en una sola app."
    />
    <meta property="og:image" content="https://wellnod.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wellnod — el cerebro de tu local" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wellnod · El cerebro de tu local" />
    <meta
      name="twitter:description"
      content="Comandas digitales, cobros y facturación ARCA, fichaje y un copiloto de IA en español."
    />
    <meta name="twitter:image" content="https://wellnod.com/og.png" />
    <!--SEO:end-->

    <!-- Aplica el tema guardado antes de pintar, para evitar el flash de color -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("wellnod-landing:theme")
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
